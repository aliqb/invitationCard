<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Line icon: open envelope, letter rising out, heart seal. Transparent background.
       Strokes are lapis on light browser chrome and ivory on dark chrome. -->
  <style>
    .line { stroke: #1a2366; }
    @media (prefers-color-scheme: dark) { .line { stroke: #fffdf7; } }
  </style>
  <g class="line" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- back of the envelope: opened flap tip peeking above the letter, side edges -->
    <path d="M24 10 32 4 40 10"/>
    <path d="M4 28 14 21M60 28 50 21"/>
    <!-- letter (its lower part is hidden behind the front pocket) -->
    <path d="M14 34.8V10h36v24.8"/>
    <path d="M21 17h22M21 23h22M21 29h22"/>
    <!-- envelope body and front pocket -->
    <path d="M4 28v30h56V28"/>
    <path d="M4 28 32 47 60 28"/>
    <path d="M4 58 26 45M60 58 38 45"/>
  </g>
  <!-- heart seal -->
  <path class="line" d="M32 55c-10-7-9-15.5-4-15.5 2 0 3.3 1.3 4 3 .7-1.7 2-3 4-3 5 0 6 8.5-4 15.5Z"
        fill="#c0262c" stroke-width="3" stroke-linejoin="round"/>
</svg>
